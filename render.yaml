# Render Blueprint: https://render.com/docs/blueprint-spec
#   Backend  → Docker web service (FastAPI + LangGraph), from ./Dockerfile
#   Frontend → Static Site (React build), calls the backend directly; CORS allows only its origin.
#
# After the first deploy, check the two .onrender.com URLs Render assigned: if a name was taken,
# Render adds a suffix. Then update VITE_API_BASE_URL (frontend) and CORS_ORIGINS (backend) and redeploy.
# SQLite data (conversations, audit) is ephemeral on the free plan and is reset on each deploy or restart.

services:
  - type: web
    name: enterprise-copilot-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Secrets: entered in the Render dashboard on first deploy, never stored in git.
      - key: GOOGLE_API_KEY
        sync: false  # LLM gateway: answer lane (Gemini first)
      - key: GROQ_API_KEY
        sync: false  # LLM gateway: fast lane (gpt-oss-20b first) + fallback
      - key: OPENROUTER_API_KEY
        sync: false  # LLM gateway: last fallback (free models)
      - key: PINECONE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true  # random value signing the session tokens
      - key: DEMO_ACCOUNTS
        value: "true"  # one-click employee / HR manager / admin logins on the public demo
      - key: LANGSMITH_API_KEY
        sync: false
      # LangSmith tracing of every LangGraph run (picked up automatically by LangChain).
      # Set LANGSMITH_TRACING to "false" to turn it off without removing the key.
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: enterprise-copilot-prod
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com  # EU accounts: https://eu.api.smith.langchain.com
      # Configuration
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://enterprise-copilot-l6so.onrender.com  # URL Render assigned to the static site
      - key: PINECONE_INDEX_NAME
        value: enterprise-copilot
      - key: HR_NAMESPACE
        value: company-hr-kb
      - key: CLOUDOPS_NAMESPACE
        value: cloudops-runbooks
      - key: IT_NAMESPACE
        value: it-support-kb
      - key: LLM_PROVIDERS
        value: gemini,groq,cloudflare,openrouter
      - key: LLM_FAST_PROVIDERS
        value: groq,cloudflare,gemini,openrouter
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: EMBEDDING_MODEL
        value: llama-text-embed-v2  # Pinecone Inference
      - key: EMBEDDING_DIMENSION
        value: "768"

  - type: web
    name: enterprise-copilot
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_BASE_URL
        value: https://enterprise-copilot-api.onrender.com
    routes:
      # Single-page app: /hr/c/... and other client routes load index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
